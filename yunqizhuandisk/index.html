<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸运大转盘 · 720 科技</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #64748b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --gold: #f59e0b;
            --red: #ef4444;
            --green: #10b981;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #181c27;
                --card-bg: #1e293b;
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .container {
            max-width: 620px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        /* 微信内提示条 */
        .wechat-tip {
            display: none;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        /* 转盘 */
        .wheel-wrap {
            position: relative;
            margin: 24px auto 30px;
            width: 320px;
            height: 320px;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            border: 8px solid #fff;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }

        .wheel .segment {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 50%;
            transform-origin: bottom right;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel .segment span {
            position: absolute;
            transform: translate(-50%, -50%);
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
            width: 90px;
            line-height: 1.3;
            text-align: center;
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.5);
            z-index: 10;
            text-align: center;
            line-height: 1.2;
            cursor: pointer;
            user-select: none;
        }

        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 34px solid var(--red);
            z-index: 20;
            filter: drop-shadow(0 3px 4px rgba(0,0,0,0.3));
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: -6px;
            left: -8px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 16px solid #fff;
        }

        /* 结果卡片 */
        .result-box {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            display: none;
        }

        .result-box.show {
            display: block;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .result-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .result-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .result-code {
            display: inline-block;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.12), rgba(139, 92, 246, 0.12));
            border: 1px dashed var(--accent-color);
            color: var(--accent-color);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 12px 0;
            user-select: all;
        }

        .result-hint {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .btn {
            display: inline-block;
            padding: 14px 36px;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            margin-top: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            box-shadow: 0 6px 18px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(99, 102, 241, 0.5);
        }

        .btn-disabled {
            background: var(--text-secondary);
            color: #fff;
            opacity: 0.6;
            cursor: not-allowed;
        }

        .chances-box {
            margin-bottom: 24px;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .rules {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px 20px;
            box-shadow: var(--shadow);
            text-align: left;
            margin-top: 24px;
        }

        .rules h3 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--accent-color);
        }

        .rules ul {
            list-style: none;
        }

        .rules li {
            padding: 8px 0;
            font-size: 0.9rem;
            color: var(--text-secondary);
            padding-left: 24px;
            position: relative;
        }

        .rules li::before {
            content: '•';
            position: absolute;
            left: 8px;
            color: var(--accent-color);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="🎡-幸运大转盘">🎡 幸运大转盘</h1>
            <p>转出好运，赢取会员与优惠码</p>
        </div>

        <!-- 微信内访问提示 -->
        <div class="wechat-tip" id="wechatTip">
            ⚠️ 检测到您在<b>微信</b>内打开，抽奖可能受限。<br>
            请点击右上角 <b>···</b> → <b>在浏览器中打开</b> 以获得最佳体验！
        </div>

        <div class="chances-box" id="chancesBox">今日剩余抽奖次数：<b>3</b></div>

        <div class="wheel-wrap">
            <div class="pointer"></div>
            <div class="wheel" id="wheel"></div>
            <div class="wheel-center" id="wheelCenter">抽奖</div>
        </div>

        <button class="btn btn-primary" id="spinBtn">开始抽奖</button>

        <div class="result-box" id="resultBox">
            <div class="result-icon" id="resultIcon">🎉</div>
            <div class="result-title" id="resultTitle"></div>
            <div class="result-code" id="resultCode" style="display:none;"></div>
            <div class="result-hint" id="resultHint"></div>
            <a class="btn btn-primary" href="/about/" id="contactBtn">联系站长微信</a>
        </div>

        <div class="rules">
            <h3>🎯 抽奖规则</h3>
            <ul>
                <li><b>30%</b> 概率抽出 <b>VIP 会员</b>（激活后永久有效）</li>
                <li><b>40%</b> 概率抽出 <b>1 折优惠码</b>（格式：优惠-xxxxxx1）</li>
                <li><b>30%</b> 概率抽出 <b>2 折优惠码</b>（格式：优惠-xxxxxx2）</li>
                <li>抽中优惠码后，请 <b>联系站长微信</b> 兑换使用</li>
                <li>每人每日可通过多种方式获得抽奖次数</li>
            </ul>
        </div>
    </div>

    <script>
        // ===== 微信内访问检测 =====
        (function detectWechat() {
            var ua = navigator.userAgent.toLowerCase();
            var inWechat = /micromessenger/i.test(ua);
            if (inWechat) {
                document.getElementById('wechatTip').style.display = 'block';
            }
        })();

        // ===== 转盘配置（8 个扇区）=====
        // 按概率分配：30% 会员 / 40% 1折 / 30% 2折
        // 8 格：会员×3格(37.5%) 调整为更接近目标，用10格更精确。这里用 10 格：会员3、1折4、2折3
        var SEGMENTS = [
            { label: 'VIP 会员', color: '#10b981' },
            { label: '1 折优惠码', color: '#6366f1' },
            { label: '2 折优惠码', color: '#8b5cf6' },
            { label: 'VIP 会员', color: '#34d399' },
            { label: '1 折优惠码', color: '#818cf8' },
            { label: '2 折优惠码', color: '#a78bfa' },
            { label: 'VIP 会员', color: '#059669' },
            { label: '1 折优惠码', color: '#4f46e5' },
            { label: '2 折优惠码', color: '#7c3aed' },
            { label: '1 折优惠码', color: '#6366f1' }
        ];
        // 概率统计：会员 3/10=30%，1折 4/10=40%，2折 3/10=30%
        var SEG_ANGLE = 360 / SEGMENTS.length;

        var wheel = document.getElementById('wheel');
        var spinBtn = document.getElementById('spinBtn');
        var wheelCenter = document.getElementById('wheelCenter');
        var resultBox = document.getElementById('resultBox');
        var resultIcon = document.getElementById('resultIcon');
        var resultTitle = document.getElementById('resultTitle');
        var resultCode = document.getElementById('resultCode');
        var resultHint = document.getElementById('resultHint');
        var chancesBox = document.getElementById('chancesBox');

        var rotating = false;
        var currentRotation = 0;

        // 绘制扇区
        function drawWheel() {
            var html = '';
            SEGMENTS.forEach(function (seg, i) {
                var startAngle = i * SEG_ANGLE;
                html += '<div class="segment" style="background:' + seg.color + '; transform: rotate(' + startAngle + 'deg) skewY(' + (90 - SEG_ANGLE) + 'deg);">';
                html += '<span style="transform: rotate(' + (startAngle + SEG_ANGLE / 2) + 'deg) translate(-50%,-50%);">' + seg.label + '</span>';
                html += '</div>';
            });
            wheel.innerHTML = html;
        }

        // 随机生成优惠码
        function genCode(kind) {
            var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
            var code = '';
            for (var i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return '优惠-' + code + kind;
        }

        // 抽奖结果
        function getResult() {
            var r = Math.random();
            if (r < 0.3) return { type: 'vip', segment: 0 }; // 会员 30%
            if (r < 0.7) return { type: 'discount1', segment: 1 }; // 1折 40%
            return { type: 'discount2', segment: 2 }; // 2折 30%
        }

        // 根据结果找到对应的扇区索引（取该类别的第一个扇区）
        function getSegmentIndex(type) {
            var idx = 0;
            SEGMENTS.forEach(function (seg, i) {
                if (seg.label.indexOf(type === 'vip' ? 'VIP' : (type === 'discount1' ? '1 折' : '2 折')) === 0) {
                    if (seg._used === undefined) { idx = i; seg._used = true; }
                }
            });
            // 重置标记
            SEGMENTS.forEach(function (seg) { seg._used = undefined; });
            return idx;
        }

        // 计算旋转角度让指针指向目标扇区
        function calcRotation(targetIndex) {
            // 指针在顶部（-90度 方向）。扇区中心角 = targetIndex*SEG_ANGLE + SEG_ANGLE/2
            var targetCenter = targetIndex * SEG_ANGLE + SEG_ANGLE / 2;
            // 需要旋转到 targetCenter 的负方向 + 指针对齐
            var fullRounds = 5 * 360;
            var targetRotation = fullRounds + (360 - targetCenter) + currentRotation - (currentRotation % 360);
            // 确保指针(顶部)指向扇区中心
            return targetRotation;
        }

        function spin() {
            if (rotating) return;
            var chances = parseInt(localStorage.getItem('wheel_chances') || '3');
            if (chances <= 0) {
                alert('今日抽奖次数已用完，明天再来吧！');
                return;
            }
            rotating = true;
            spinBtn.className = 'btn btn-disabled';
            spinBtn.textContent = '抽奖中...';
            wheelCenter.textContent = '转动中';
            resultBox.classList.remove('show');

            var result = getResult();
            var targetIdx = getSegmentIndex(result.type);

            // 计算目标角度，使指针指向目标扇区中心
            var targetCenter = targetIdx * SEG_ANGLE + SEG_ANGLE / 2;
            var targetAngle = 360 - targetCenter;
            currentRotation += 360 * 6 + targetAngle;
            currentRotation = currentRotation % 360 + 360 * 6;
            wheel.style.transform = 'rotate(' + currentRotation + 'deg)';

            setTimeout(function () {
                rotating = false;
                chances--;
                localStorage.setItem('wheel_chances', chances);
                updateChances(chances);
                showResult(result);
                spinBtn.className = 'btn btn-primary';
                spinBtn.textContent = '再抽一次';
                wheelCenter.textContent = '抽奖';
            }, 4200);
        }

        function showResult(result) {
            resultBox.classList.add('show');
            if (result.type === 'vip') {
                resultIcon.textContent = '👑';
                resultTitle.textContent = '恭喜您抽中 VIP 会员！';
                resultTitle.style.color = 'var(--green)';
                resultCode.style.display = 'none';
                resultHint.textContent = '请点击下方按钮联系站长，领取您的 VIP 激活码！';
            } else if (result.type === 'discount1') {
                var code1 = genCode('1');
                resultIcon.textContent = '🎟️';
                resultTitle.textContent = '恭喜您抽中 1 折优惠码！';
                resultTitle.style.color = 'var(--accent-color)';
                resultCode.style.display = 'inline-block';
                resultCode.textContent = code1;
                resultHint.textContent = '请复制优惠码，联系站长微信兑换使用！';
            } else {
                var code2 = genCode('2');
                resultIcon.textContent = '🎫';
                resultTitle.textContent = '恭喜您抽中 2 折优惠码！';
                resultTitle.style.color = 'var(--gold)';
                resultCode.style.display = 'inline-block';
                resultCode.textContent = code2;
                resultHint.textContent = '请复制优惠码，联系站长微信兑换使用！';
            }
        }

        function updateChances(c) {
            chancesBox.innerHTML = '今日剩余抽奖次数：<b>' + c + '</b>';
        }

        spinBtn.addEventListener('click', spin);
        wheelCenter.addEventListener('click', spin);

        // 初始化次数
        var today = new Date().toDateString();
        var lastDate = localStorage.getItem('wheel_date');
        if (lastDate !== today) {
            localStorage.setItem('wheel_date', today);
            localStorage.setItem('wheel_chances', '3');
        }
        updateChances(parseInt(localStorage.getItem('wheel_chances') || '3'));

        drawWheel();
    </script>
</body>
</html>
